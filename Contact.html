    <header>
        <nav class="navbar" aria-label="Main navigation">

    <main>
        <section class="contact-info">
            <h1>Contact Us</h1>
            <ul>
                <li>📞 Phone: <a href="tel:+441234567890">01234 567890</a></li>
                <li>📧 Email: <a href="mailto:info@goldenkingsoud.com">info@goldenkingsoud.com</a></li>
                <li>📍 Address: 123 Albern Sisulu road, Johannesburg, Gauteng</li>
            </ul>
        </section>

        <section class="comment-section">
            <h2>Leave a Comment</h2>
            <form id="contactForm" class="comment-form" action="/submit-comment.php" method="post" novalidate>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required aria-required="true">
                <span class="error-msg" aria-live="polite"></span>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required aria-required="true">
                <span class="error-msg" aria-live="polite"></span>

                <label for="comment">Comment:</label>
                <textarea id="comment" name="comment" rows="5" required aria-required="true"></textarea>
                <span class="error-msg" aria-live="polite"></span>

                <button type="submit">Submit</button>
            </form>

            <p class="Location-text">You can find us here:</p>
            <div id="map" style="height: 300px; margin-top: 20px;"></div>
        </section>
    </main>
